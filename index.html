<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viquito</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="stars"></div>

<div class="floating-hearts"></div>

<div class="login-box">

    <h1>💌</h1>

    <h1>Hay algo esperando por ti, Viquito</h1>

    <p>
        Para poder abrilo necesitas escribir el nombre de aquel cometa que iluminará nuestras vidas...
    </p>

    <input
        type="password"
        id="password"
        placeholder="Contraseña">
        <p>
            Y la fecha de nacimiento de Galletita
        </p>
    <input
        type="date"
        id="fecha">

    <button onclick="login()">
        Abrir Carta
    </button>

    <small id="mensaje"></small>

</div>

<script src="script.js"></script>

</body>
</html>
